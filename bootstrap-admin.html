<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bootstrap 5S Admin</title><style>body{font-family:Arial;background:#f2f4ef;padding:30px}.card{max-width:430px;margin:auto;background:#fff;padding:24px;border-radius:12px}label{display:block;font-size:12px;font-weight:bold;margin:12px 0 5px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:6px}button{margin-top:16px;padding:10px 14px;background:#2f7a52;color:#fff;border:0;border-radius:6px;font-weight:bold}#msg{margin-top:12px;color:#b5533c}</style></head><body><div class="card"><h2>First Admin Setup</h2><p>This page works only while <b>ADMIN_BOOTSTRAP_SECRET</b> is configured and no user account exists. Remove that environment variable after creating the first admin.</p><form id="f"><label>Bootstrap secret</label><input id="secret" type="password" required><label>Admin username</label><input id="u" required><label>Full name</label><input id="n" required><label>Admin password</label><input id="p" type="password" minlength="8" required><button>Create first admin</button><div id="msg"></div></form></div><script>f.onsubmit=async e=>{e.preventDefault();msg.textContent='Creating…';try{const r=await fetch('/api/admin-bootstrap',{method:'POST',headers:{'Content-Type':'application/json','x-bootstrap-secret':secret.value},body:JSON.stringify({username:u.value,full_name:n.value,password:p.value})});const b=await r.json();if(!r.ok)throw Error(b.error||'Failed');msg.style.color='#2f7a52';msg.textContent='Admin created. Remove ADMIN_BOOTSTRAP_SECRET from Vercel now, then sign in.'}catch(x){msg.style.color='#b5533c';msg.textContent=x.message}}</script></body></html>
