<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vidullanka PLC — 5S User Management</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f4ef;color:#1b2430;margin:0}.wrap{max-width:1050px;margin:30px auto;padding:0 18px}.card{background:#fff;border:1px solid #dde2d9;border-radius:12px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:700;color:#4b5563}.field input,.field select{padding:10px;border:1px solid #dde2d9;border-radius:7px;font-size:14px}.sites{display:flex;flex-wrap:wrap;gap:8px}.sites label{border:1px solid #dde2d9;padding:7px 9px;border-radius:6px;font-size:12px}.btn{border:0;border-radius:7px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#2f7a52;color:white}.danger{background:#fff;border:1px solid #e4c9c0;color:#b5533c}.muted{color:#667085;font-size:13px}.msg{min-height:20px;color:#b5533c}.user{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}.user:last-child{border-bottom:0}.pill{display:inline-block;padding:4px 7px;border-radius:12px;background:#e9f3ee;font-size:11px}.inactive{opacity:.5}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.navbar{display:flex;gap:6px;align-items:center;background:#1b2430;padding:8px 18px}
.navbar a{color:#C8CDD6;text-decoration:none;font-size:13px;font-weight:600;padding:7px 14px;border-radius:6px}
.navbar a.active{background:#2f7a52;color:#fff}
.navbar a:hover:not(.active){background:#2a3442}
@media (max-width:600px){.navbar{flex-wrap:wrap}.navbar a{flex:1 1 auto;text-align:center}}
@media (max-width:600px){
  .wrap{margin:14px auto;padding:0 12px}
  .card{padding:16px}
  .top{flex-direction:column;align-items:stretch}
  .top button{width:100%}
  .user{flex-direction:column;align-items:flex-start;gap:8px}
  .user button{align-self:flex-end}
}
</style></head><body>
<nav class="navbar"><a href="/">Audit</a><a href="/admin.html" class="active">Admin</a></nav>
<div class="wrap">
<div class="card"><div class="top"><div><div class="muted">VIDULLANKA PLC</div><h1 style="margin:4px 0">5S Auditor Accounts</h1><div class="muted">Create internal auditors with site restrictions and external auditors with access to all sites.</div></div></div><div id="who" class="muted" style="margin-top:10px"></div></div>
<div class="card"><h2>Create user</h2><form id="form"><div class="grid"><div class="field"><label>Username</label><input id="username" required></div><div class="field"><label>Full name</label><input id="fullName" required></div><div class="field"><label>Temporary / initial password</label><input id="password" type="password" minlength="8" required></div><div class="field"><label>Role</label><select id="role"><option value="internal">Internal Auditor</option><option value="external">External Auditor</option><option value="admin">Administrator</option></select></div></div><div style="margin-top:14px"><div class="muted" style="margin-bottom:6px">Assign site(s) — required for Internal Auditor. External Auditors and Administrators can access all sites.</div><div class="sites" id="sites"></div></div><div style="margin-top:14px"><button class="btn primary">Create account</button></div><div class="msg" id="msg"></div></form></div>
<div class="card"><h2>Existing users</h2><div id="users">Loading…</div></div>
</div><script>
const SITES=['BBO','BKN','BTO','EME','GNT','HRN','LKM','MGT','MVB','ORIC','RDP','UDW','VBL','WMB'];
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('sites').innerHTML=SITES.map(s=>`<label><input type="checkbox" value="${s}"> ${s}</label>`).join('');
async function api(path,opt={}){const r=await fetch(path,{credentials:'same-origin',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let b={};try{b=await r.json()}catch{}if(!r.ok)throw Error(b.error||`HTTP ${r.status}`);return b}
async function init(){try{const me=await api('/api/me');if(me.user.role!=='admin')throw Error('Administrator access required.');$('who').textContent=`Signed in as ${me.user.full_name}`;await refresh()}catch(e){$('users').innerHTML=`<div class="msg">${esc(e.message)}. <a href="/">Sign in</a></div>`;}}
async function refresh(){const b=await api('/api/users');$('users').innerHTML=b.users.map(u=>`<div class="user ${u.is_active?'':'inactive'}"><div><b>${esc(u.full_name)}</b> <span class="pill">${esc(u.role)}</span><div class="muted">@${esc(u.username)} · Sites: ${u.sites?.length?esc(u.sites.join(', ')):'All sites'} · ${u.is_active?'Active':'Inactive'}</div></div><button class="btn danger" onclick="disableUser(${u.id},${u.is_active})">${u.is_active?'Disable':'Enable'}</button></div>`).join('')||'<div class="muted">No users.</div>'}
window.disableUser=async(id,active)=>{try{await api('/api/user?id='+id,{method:'PATCH',body:JSON.stringify({is_active:!active})});await refresh()}catch(e){alert(e.message)}};
$('form').addEventListener('submit',async e=>{e.preventDefault();$('msg').textContent='Creating…';const role=$('role').value;const sites=[...document.querySelectorAll('#sites input:checked')].map(x=>x.value);try{await api('/api/users',{method:'POST',body:JSON.stringify({username:$('username').value,full_name:$('fullName').value,password:$('password').value,role,sites})});$('form').reset();$('msg').textContent='Account created.';await refresh()}catch(e){$('msg').textContent=e.message}});$('role').addEventListener('change',()=>{});init();
</script></body></html>
